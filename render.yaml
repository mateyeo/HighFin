services:
  - type: web
    name: highfin
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node node_modules/next/dist/bin/next start
    envVars:
      - key: NODE_ENV
        value: production

      # ── Database ────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false

      # ── Auth ────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false

      # ── AI ──────────────────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Email (SMTP) ─────────────────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # ── Frontend (public) ────────────────────────────────────────────
      - key: NEXT_PUBLIC_APP_URL
        sync: false
