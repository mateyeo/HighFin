services:
  # ── Frontend service (Next.js pages — src/frontend/pages/) ─────────
  # NEXT_PUBLIC_APP_URL must point to the highfin-backend service URL
  # so all /api/* calls from the browser reach the backend.
  - type: web
    name: highfin
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node node_modules/next/dist/bin/next start
    envVars:
      - key: NODE_ENV
        value: production

      # Set to the backend service URL: https://highfin-backend.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  # ── Backend API service (src/backend — API routes + models + lib) ──
  # NEXT_PUBLIC_APP_URL must point to this service's own URL
  # so the mailer builds correct email verification links.
  - type: web
    name: highfin-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node node_modules/next/dist/bin/next start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production

      # ── Database ──────────────────────────────────────────────────
      # src/backend/lib/db.ts
      - key: MONGODB_URI
        sync: false

      # ── Auth ──────────────────────────────────────────────────────
      # src/backend/lib/jwt.ts
      - key: JWT_SECRET
        sync: false

      # ── AI ────────────────────────────────────────────────────────
      # src/backend/api/chat.ts
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Email ─────────────────────────────────────────────────────
      # src/backend/lib/mailer.ts
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Set to this service's own URL: https://highfin-backend.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Set to the frontend service URL: https://highfin.onrender.com
      # Tells the backend which origin is allowed to make cross-origin requests
      - key: CORS_ORIGIN
        sync: false
